name: Download PyTorch Wheels (Windows)

on:
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          BRANCH="pytorch-deps"
          if git ls-remote --exit-code --heads origin $BRANCH; then
            git checkout $BRANCH
            git pull origin $BRANCH
          else
            git checkout --orphan $BRANCH
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Init $BRANCH"
            git push --set-upstream origin $BRANCH
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Windows wheels
        run: |
          mkdir all_wheels
          pip download \
            --dest all_wheels \
            --only-binary :all: \
            --platform win_amd64 \
            --python-version 312 \
            --implementation cp \
            --extra-index-url https://download.pytorch.org/whl/cu124 \
            torch==2.6.0+cu124 \
            torchvision==0.21.0+cu124 \
            torchaudio==2.6.0+cu124

      - name: Create split zip archive (45 MB parts)
        run: |
          mkdir -p wget                     # <-- FIX: create the output folder first
          cd all_wheels
          zip -0 -s 45m ../wget/pytorch_all_deps.zip *
          cd ..
          rm -rf all_wheels

      - name: Generate README with download links
        run: |
          rm -f README.md
          echo "# 📥 PyTorch Windows Wheels (Split Archive)" > README.md
          echo "Generated on: $(date)" >> README.md
          echo "" >> README.md
          echo "Download all parts and extract with 7-Zip/winRAR." >> README.md
          echo "" >> README.md
          for file in wget/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              encoded_filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$filename")
              url="https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/wget/$encoded_filename"
              echo "- [Download $filename]($url)" >> README.md
            fi
          done

      - name: Commit in batches
        env:
          BATCH_SIZE: 5
        run: |
          # Commit README first
          if [ -f README.md ]; then
            git add README.md
            git commit -m "[bot] Add README with links" || echo "No changes to README"
            git push
          fi

          cd wget
          FILES=($(ls -1 | sort))
          TOTAL=${#FILES[@]}
          if [ $TOTAL -eq 0 ]; then
            echo "No files to commit."
            exit 0
          fi
          echo "Found $TOTAL part files. Committing in batches of $BATCH_SIZE..."
          for ((i=0; i<$TOTAL; i+=$BATCH_SIZE)); do
            BATCH=("${FILES[@]:i:$BATCH_SIZE}")
            echo "Committing batch $((i/BATCH_SIZE + 1)): ${BATCH[*]}"
            git add "${BATCH[@]}"
            git commit -m "[bot] Add parts $((i+1)) to $((i+${#BATCH[@]})) of pytorch_all_deps"
            git push
          done
