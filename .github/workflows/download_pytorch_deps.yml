name: Download All PyTorch Wheels

on:
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          BRANCH="pytorch-deps"
          if git ls-remote --exit-code --heads origin $BRANCH; then
            git checkout $BRANCH
            git pull origin $BRANCH
          else
            git checkout --orphan $BRANCH
            git rm -rf . || true
            git commit --allow-empty -m "[bot] Init $BRANCH"
            git push --set-upstream origin $BRANCH
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # same as your ComfyUI's Python version

      - name: Download all required wheels
        run: |
          mkdir all_wheels
          pip download \
            --dest all_wheels \
            --only-binary :all: \
            --extra-index-url https://download.pytorch.org/whl/cu124 \
            torch==2.6.0+cu124 \
            torchvision==0.21.0+cu124 \
            torchaudio==2.6.0+cu124
          # Now all_wheels/ contains every .whl needed

      - name: Package into a single zip
        run: |
          zip -r pytorch_all_deps.zip all_wheels/
          rm -rf all_wheels

      - name: Commit and push
        run: |
          git add pytorch_all_deps.zip
          git commit -m "[bot] Add complete PyTorch dependency wheels" || echo "Nothing to commit"
          git push
